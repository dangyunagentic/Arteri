services:
  arteri:
    build: .
    ports:
      - "8787:8787"
    environment:
      - PORT=8787
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
    volumes:
      - arteri-data:/app/data
    restart: unless-stopped

volumes:
  arteri-data:
